<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../css/style.css">
<style>body{padding:12px}#g{display:grid;grid-template-columns:repeat(6,160px);gap:10px}#g div{border:2px solid var(--ink);background:var(--paper-2)}#g svg{width:100%;display:block}#o{display:grid;grid-template-columns:repeat(11,100px);gap:6px;margin-top:12px}#o svg{width:100px;height:100px;background:var(--paper);border:1px solid #0002}</style>
<div id="g"></div><div id="o"></div>
<script type="module">
import { portraitSvg, patternDefsSvg, objectSvg } from '../js/art.js';
import { ROLES, OBJECTS } from '../js/themes.js';
document.body.insertAdjacentHTML('afterbegin', patternDefsSvg());
const g = document.getElementById('g');
let i = 0;
for (const r of ROLES) for (const s of [1, 2]) {
  const gender = r.gender === 'any' ? (s === 1 ? 'f' : 'm') : r.gender;
  g.insertAdjacentHTML('beforeend', `<div>${portraitSvg({ role: r.id, gender, lookSeed: 1000 + i++ }, { dead: i === 3 })}</div>`);
}
document.getElementById('o').innerHTML = Object.keys(OBJECTS).map(o => `<svg class="art" viewBox="0 0 100 100">${objectSvg(o)}</svg>`).join('');
</script>
